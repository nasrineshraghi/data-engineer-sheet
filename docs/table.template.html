<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DE Sheet — Quick reference</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Sora:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root {
  --ink: #152033;
  --muted: #5a6b7d;
  --line: #e2e8f0;
  --paper: #ffffff;
  --bg: #f4f7fb;
  --sky: #0369a1;
  --teal: #0f766e;
  --accent: #0e7490;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  color: var(--ink);
  font-family: "Sora", sans-serif;
  background: var(--bg);
  line-height: 1.5;
}
.wrap {
  width: min(820px, calc(100% - 2rem));
  margin: 0 auto;
  padding: 2rem 0 4rem;
}
header.page {
  margin-bottom: 1.25rem;
}
h1 {
  font-family: "Fraunces", Georgia, serif;
  font-size: clamp(1.9rem, 4vw, 2.5rem);
  margin: 0 0 .4rem;
  letter-spacing: -0.02em;
  color: var(--ink);
}
.sub {
  margin: 0;
  color: var(--muted);
  font-size: .95rem;
}
.sub a { color: var(--sky); font-weight: 600; text-decoration: none; }
.sub a:hover { text-decoration: underline; }

.toolbar {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  flex-wrap: wrap;
  gap: .6rem;
  align-items: center;
  margin: 1rem 0 1.5rem;
  padding: .75rem .9rem;
  background: rgba(255,255,255,.92);
  backdrop-filter: blur(12px);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: 0 8px 24px rgba(21,32,51,.06);
}
#q {
  flex: 1;
  min-width: 200px;
  border: 0;
  outline: 0;
  font: inherit;
  font-size: 1rem;
  background: transparent;
  color: var(--ink);
}
#q::placeholder { color: #94a3b8; }
select {
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: .45rem .75rem;
  font: inherit;
  background: #f8fafc;
  color: var(--ink);
  max-width: 100%;
}
.count {
  font-size: .8rem;
  color: var(--muted);
  font-weight: 600;
  white-space: nowrap;
}
.count strong { color: var(--teal); }

.section {
  margin: 0 0 2rem;
}
.section-title {
  position: sticky;
  top: 4.2rem;
  z-index: 5;
  font-family: "Fraunces", Georgia, serif;
  font-size: 1.15rem;
  margin: 0 0 .75rem;
  padding: .55rem .8rem;
  background: #e0f2fe;
  color: #0c4a6e;
  border-radius: 10px;
  border-left: 4px solid var(--sky);
}

.card {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 1.1rem 1.2rem 1.15rem;
  margin-bottom: .7rem;
  box-shadow: 0 1px 2px rgba(21,32,51,.04);
}
.card:hover {
  border-color: #bae6fd;
  box-shadow: 0 8px 20px rgba(3,105,161,.08);
}
.card-top {
  display: flex;
  flex-wrap: wrap;
  gap: .5rem .75rem;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: .45rem;
}
.kw {
  font-family: "Fraunces", Georgia, serif;
  font-size: 1.2rem;
  font-weight: 700;
  margin: 0;
  letter-spacing: -0.015em;
  color: var(--teal);
}
.pill {
  font-size: .68rem;
  font-weight: 700;
  letter-spacing: .03em;
  text-transform: uppercase;
  color: #0369a1;
  background: #e0f2fe;
  padding: .2rem .5rem;
  border-radius: 999px;
}
.def {
  margin: 0 0 .75rem;
  font-family: "Source Serif 4", Georgia, serif;
  font-size: 1.05rem;
  line-height: 1.55;
  color: #1e293b;
}
.ex-label {
  font-size: .68rem;
  font-weight: 700;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: #64748b;
  margin-bottom: .3rem;
}
.ex {
  margin: 0;
  padding: .75rem .85rem;
  border-radius: 10px;
  background: #0f172a;
  color: #e2e8f0;
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: .82rem;
  line-height: 1.45;
  white-space: pre-wrap;
  overflow-x: auto;
}
.empty {
  text-align: center;
  color: var(--muted);
  padding: 2.5rem 1rem;
  display: none;
}
.section.hidden, .card.hidden { display: none; }

@media (max-width: 640px) {
  .section-title { top: 5.2rem; }
  .kw { font-size: 1.1rem; }
  .def { font-size: 1rem; }
}
@media print {
  .toolbar { position: static; box-shadow: none; }
  .section-title { position: static; }
  .card { break-inside: avoid; box-shadow: none; }
}
</style>
</head>
<body>
<main class="wrap">
  <header class="page">
    <h1>Quick reference</h1>
    <p class="sub">__COUNT__ keywords · easy scan by section · <a href="index.html">Study app</a> · <a href="../QUICK_REF.md">Markdown</a></p>
  </header>

  <div class="toolbar">
    <input id="q" type="search" placeholder="Filter by keyword or definition…" autofocus />
    <select id="sec"><option value="">All sections</option>__CAT_OPTS__</select>
    <div class="count"><strong id="shown">__COUNT__</strong> / __COUNT__</div>
  </div>

  <div id="list">
__ROWS__
  </div>
  <div class="empty" id="empty">No matches. Try another keyword or section.</div>
</main>
<script>
const q = document.getElementById('q');
const sec = document.getElementById('sec');
const shown = document.getElementById('shown');
const empty = document.getElementById('empty');
const cards = [...document.querySelectorAll('.card')];
const sections = [...document.querySelectorAll('.section')];

function filter() {
  const term = q.value.trim().toLowerCase();
  const section = sec.value;
  let n = 0;
  for (const card of cards) {
    const text = card.innerText.toLowerCase();
    const okTerm = !term || text.includes(term);
    const okSec = !section || card.dataset.section === section;
    const show = okTerm && okSec;
    card.classList.toggle('hidden', !show);
    if (show) n++;
  }
  for (const block of sections) {
    const visible = [...block.querySelectorAll('.card')].some((c) => !c.classList.contains('hidden'));
    block.classList.toggle('hidden', !visible);
  }
  shown.textContent = String(n);
  empty.style.display = n ? 'none' : 'block';
}
q.addEventListener('input', filter);
sec.addEventListener('change', filter);
</script>
</body>
</html>
