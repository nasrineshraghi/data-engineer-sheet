<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DE Sheet — Quick table</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Sora:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root {
  --ink:#0f1c2e; --muted:#3d5368; --sky:#0284c7; --teal:#0d9488; --coral:#e11d48; --gold:#ca8a04;
}
* { box-sizing:border-box; }
body {
  margin:0; color:var(--ink); font-family:"Sora",sans-serif;
  background:
    radial-gradient(800px 400px at 0% 0%, rgba(2,132,199,.22), transparent 55%),
    radial-gradient(700px 380px at 100% 0%, rgba(225,29,72,.14), transparent 50%),
    linear-gradient(160deg,#e0f2fe,#fdf2f8 45%,#ecfdf5);
}
.wrap { width:min(1200px, calc(100% - 1.5rem)); margin:0 auto; padding:1.5rem 0 3rem; }
h1 {
  font-family:"Fraunces",Georgia,serif; font-size:clamp(1.8rem,4vw,2.6rem); margin:0 0 .35rem;
  background:linear-gradient(120deg,#0f766e,#0284c7,#e11d48); -webkit-background-clip:text; background-clip:text; color:transparent;
}
.sub { color:var(--muted); margin:0 0 1rem; }
.sub a { color:var(--sky); font-weight:600; }
.toolbar {
  display:flex; flex-wrap:wrap; gap:.6rem; align-items:center; margin-bottom:1rem;
  position:sticky; top:.4rem; z-index:5; padding:.65rem .8rem; border-radius:16px;
  background:rgba(255,255,255,.88); backdrop-filter:blur(10px);
  border:2px solid transparent;
  background-image:linear-gradient(#fff,#fff), linear-gradient(90deg,#0d9488,#0284c7,#e11d48);
  background-origin:border-box; background-clip:padding-box,border-box;
  box-shadow:0 10px 30px rgba(2,132,199,.12);
}
#q {
  flex:1; min-width:180px; border:0; outline:0; font:inherit; font-size:.95rem; background:transparent;
}
select {
  border:1.5px solid #67e8f9; border-radius:999px; padding:.4rem .7rem; font:inherit; background:#ecfeff; color:#0e7490; font-weight:600;
}
.count { font-size:.82rem; color:var(--muted); font-weight:600; }
.count strong { color:var(--coral); }
.table-wrap {
  overflow:auto; border-radius:18px; background:#fff;
  box-shadow:0 16px 40px rgba(15,28,46,.08);
  border:1px solid rgba(2,132,199,.15);
}
table { width:100%; border-collapse:collapse; font-size:.84rem; }
th {
  position:sticky; top:0; text-align:left; padding:.75rem .7rem; font-size:.72rem; letter-spacing:.05em;
  text-transform:uppercase; color:#fff;
  background:linear-gradient(90deg,#0d9488,#0284c7,#7c3aed);
}
td { padding:.65rem .7rem; vertical-align:top; border-top:1px solid #e2e8f0; line-height:1.4; }
tr:nth-child(even) td { background:#f8fafc; }
tr:hover td { background:#ecfeff; }
.kw { font-weight:700; color:#0f766e; white-space:nowrap; min-width:10rem; }
.sec { min-width:9rem; }
.pill {
  display:inline-block; padding:.15rem .45rem; border-radius:999px; font-size:.68rem; font-weight:700;
  background:#e0f2fe; color:#0369a1; white-space:normal;
}
.ex { font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:.76rem; color:#334155; max-width:28rem; }
@media print {
  body { background:#fff; }
  .toolbar { position:static; box-shadow:none; }
  th { background:#0d9488 !important; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
}
</style>
</head>
<body>
<main class="wrap">
  <h1>Quick reference table</h1>
  <p class="sub">__COUNT__ keywords · definition · example · section · <a href="index.html">Study app</a> · <a href="../QUICK_REF.md">Markdown</a></p>
  <div class="toolbar">
    <input id="q" type="search" placeholder="Filter keywords, definitions, examples…" />
    <select id="sec"><option value="">All sections</option>__CAT_OPTS__</select>
    <div class="count"><strong id="shown">__COUNT__</strong> / __COUNT__</div>
  </div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr><th>Keyword</th><th>Section</th><th>Definition</th><th>Example</th></tr>
      </thead>
      <tbody id="tbody">
__ROWS__
      </tbody>
    </table>
  </div>
</main>
<script>
const q = document.getElementById('q');
const sec = document.getElementById('sec');
const shown = document.getElementById('shown');
const rows = [...document.querySelectorAll('#tbody tr')];
function filter() {
  const term = q.value.trim().toLowerCase();
  const section = sec.value;
  let n = 0;
  for (const row of rows) {
    const text = row.innerText.toLowerCase();
    const okTerm = !term || text.includes(term);
    const okSec = !section || row.querySelector('.pill').textContent === section;
    const show = okTerm && okSec;
    row.style.display = show ? '' : 'none';
    if (show) n++;
  }
  shown.textContent = String(n);
}
q.addEventListener('input', filter);
sec.addEventListener('change', filter);
</script>
</body>
</html>
