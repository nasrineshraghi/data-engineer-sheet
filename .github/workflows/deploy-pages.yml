# Publish ./docs to the gh-pages branch (static study app)
name: Deploy study app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare publish folder
        run: |
          mkdir -p _site
          cp docs/index.html docs/app.html docs/table.html docs/ping.html docs/concepts.json docs/scenarios.json docs/playbook.json docs/data.js docs/.nojekyll _site/
          # don't publish templates / enrichment source

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          force_orphan: true
          commit_message: "Deploy study app"
